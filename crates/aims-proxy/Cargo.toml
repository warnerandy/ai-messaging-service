[package]
name = "aims-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust AHP proxy bot connecting a local Agent Host Protocol server to the AI Messaging Service"

[[bin]]
name = "aims-proxy"
path = "src/main.rs"

[lib]
name = "aims_proxy"
path = "src/lib.rs"

[dependencies]
ahp.workspace = true
ahp-types.workspace = true
ahp-ws.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
base64.workspace = true
thiserror.workspace = true
futures-util.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
url = "2.5"
