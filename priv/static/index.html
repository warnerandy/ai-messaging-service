<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2489ff" />
    <meta name="description" content="Chat with your AI bots in real time." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Botamus" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" href="/botamus-prime-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/botamus-prime-192.png" />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <title>Botamus Prime</title>
  </head>
  <body>
    <div id="splash-screen" class="splash-screen">
      <div class="splash-inner">
        <img src="/botamus-prime-192.png" alt="Botamus Prime" class="splash-logo" />
        <h1 class="splash-title">Botamus Prime</h1>
        <div class="splash-loader">
          <div class="splash-loader-bar"></div>
        </div>
      </div>
    </div>

    <div id="app"></div>

    <script type="module" src="/assets/js/app.js"></script>
    <script>
      setTimeout(() => {
        const splash = document.getElementById("splash-screen");
        if (splash) {
          splash.classList.add("splash-hidden");
          setTimeout(() => splash.remove(), 400);
        }
      }, 2000);
    </script>
  </body>
</html>
