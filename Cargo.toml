[workspace]
resolver = "2"
members = [
    "crates/aims-server",
    "crates/aims-proxy",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ahp = "1.0.0"
ahp-types = "1.0.0"
ahp-ws = "1.0.0"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
thiserror = "2.0"
futures-util = "0.3"
